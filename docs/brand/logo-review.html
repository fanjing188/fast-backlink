<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast-Backlink · 书签链 Logo 候选</title>
<style>
:root{color-scheme:light;--blue:#315fc7;--ink:#192332;--muted:#5a6676;--line:#dae0e8;--paper:#fff;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:56px 48px}header{display:flex;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}.hero{display:grid;grid-template-columns:232px 1fr;gap:64px;align-items:center;padding:64px 0}.hero img{width:232px;height:232px}.eyebrow{font-size:14px;color:var(--blue);font-weight:650}h1{font-size:52px;letter-spacing:-.035em;line-height:1.15;margin:12px 0 20px;font-weight:750}.lead{font-size:24px;line-height:1.4;margin:0 0 16px}.note{color:var(--muted);margin:0;max-width:52ch}.samples{display:grid;grid-template-columns:1fr 1fr;gap:48px;border-top:1px solid var(--line);padding:32px 0}.samples h2{font-size:18px;margin:0 0 20px}.sizes{display:flex;gap:24px;align-items:flex-end;min-height:90px}.size{display:grid;justify-items:center;gap:12px;font-size:12px;color:var(--muted)}.dark{background:#1b2029;padding:24px;border-radius:16px;display:flex;align-items:center;gap:16px;color:#f4f6fb}.dark img{width:48px;height:48px}.dark strong{font-size:18px;display:block}.dark span{font-size:13px;color:#b7c0ce}footer{border-top:1px solid var(--line);padding-top:24px;font-size:13px;color:var(--muted)}
@media(max-width:700px){main{padding:24px}header{font-size:12px}.hero{grid-template-columns:1fr;gap:24px;padding:36px 0}.hero img{width:112px;height:112px}h1{font-size:36px;margin-top:8px}.lead{font-size:21px}.samples{grid-template-columns:1fr;gap:32px}.sizes{gap:24px}.dark{padding:20px}footer{font-size:12px}}
</style></head><body><main>
<header><strong>Fast-Backlink</strong><span>Logo 候选 · 书签链</span></header>
<section class="hero"><img src="../../extension/icons/mark.svg" alt="蓝底白色书签与链节组成的 Fast-Backlink 标识"><div><div class="eyebrow">外链表单助手</div><h1>Fast-Backlink</h1><p class="lead">填一次资料，复用每次提交。</p><p class="note">辅助填写表单，存档待验证任务，把来源与产品素材保存在本机。验证码与最终提交，由你完成。</p></div></section>
<section class="samples"><div><h2>从工具栏到项目介绍</h2><div class="sizes"><div class="size"><img src="../../extension/icons/icon-16.png" width="16" height="16" alt="16像素工具栏图标"><span>16 px</span></div><div class="size"><img src="../../extension/icons/icon-32.png" width="32" height="32" alt="32像素图标"><span>32 px</span></div><div class="size"><img src="../../extension/icons/icon-48.png" width="48" height="48" alt="48像素图标"><span>48 px</span></div><div class="size"><img src="../../extension/icons/icon-128.png" width="64" height="64" alt="128像素图标缩略展示"><span>128 px</span></div></div></div><div><h2>深色界面中的识别</h2><div class="dark"><img src="../../extension/icons/icon-48.png" alt="深色底上的插件标识"><div><strong>Fast-Backlink</strong><span>填写 · 存档 · 资产复用</span></div></div></div></section>
<footer>设计说明：书签表示保存，链节表示复用。同一矢量原件输出全部尺寸。本页为品牌设计图板，不是平台实投证据。</footer>
</main></body></html>
