<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast-Backlink 外链库</title><link rel="stylesheet" href="vendor/fbl/brand.css"><link rel="stylesheet" href="ui/app.css">
<!-- 沿用既有 Operate 界面：先选产品和筛选，再查看六列清单；批量动作固定在底部。 -->
<style>
.library{max-width:1280px;margin:auto;padding:24px;display:grid;gap:16px}.library>*,.table-wrap{min-width:0}.appbar{position:static;flex-wrap:wrap}.mark{width:28px;height:28px}.actions,.pager,.selection,.batch-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{min-width:0;display:grid;gap:4px}.field>*{min-width:0;width:100%}.query{grid-column:span 2}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}table{width:100%;min-width:800px;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line-2)}th{font-weight:600;background:var(--bg)}td small{display:block;color:var(--ink-2)}.selected-status{color:var(--ok)}.stale{color:var(--ink-3)}.batch-bar{position:sticky;bottom:8px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}.batch-bar select{max-width:160px}.editor,.workflow{padding:16px;border:1px solid var(--line);border-radius:var(--r);display:grid;gap:12px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:0;padding:0}.wide{grid-column:1/-1}.empty{padding:24px}.task{padding:12px 0;border-bottom:1px solid var(--line)}.task p{overflow-wrap:anywhere}dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:min(520px,calc(100% - 32px))}dialog::backdrop{background:rgb(0 0 0 / .4)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}button,input,select,textarea{font:inherit}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}button{white-space:normal}.pager{justify-content:flex-end}.batch-bar[hidden],section[hidden],dialog[hidden]{display:none}@media(max-width:700px){input,select,textarea{font-size:16px}.library{padding:12px}.filters,.editor-grid{grid-template-columns:1fr 1fr}.actions{width:100%}.actions button{flex:1 1 40%}.query{grid-column:1/-1}}@media(max-width:370px){.filters,.editor-grid{grid-template-columns:minmax(0,1fr)}.wide,.query{grid-column:auto}.batch-bar>*{max-width:100%}}
.table-wrap .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:176px;align-items:stretch}
.table-wrap .actions button{width:100%;height:100%;min-height:36px}
.editor input,.editor select,.editor textarea{font-size:16px}
</style></head><body>
<header class="appbar"><img class="mark" src="icons/icon-48.png" alt=""><div class="grow"><h1>Fast-Backlink 外链库</h1><p class="muted">选产品，核对提交状态，再批量处理。</p></div><div class="actions"><button id="add">新增平台</button><button id="import-open">导入文件</button><button id="export" disabled>导出筛选结果 CSV</button><button id="manual-open">待人工 0</button><button id="reload">刷新</button></div></header>
<main class="library">
<section class="filters" aria-label="筛选外链平台">
<div class="field"><label for="site">目标产品</label><select id="site"><option value="">未选择产品</option></select></div>
<div class="field query"><label for="search">搜索域名或链接</label><input id="search" type="search" autocomplete="off"></div>
<div class="field"><label for="scenario">外链类型</label><select id="scenario"></select></div>
<div class="field"><label for="fee">付费类型</label><select id="fee"></select></div>
<div class="field"><label for="status">提交状态</label><select id="status"><option value="all">全部状态</option><option value="unsubmitted">未提交</option><option value="submitted">已提交</option><option value="processing">处理中</option></select></div>
<div class="field"><label for="dr-min">DR 至少</label><input id="dr-min" type="number" min="0" max="100"></div>
<div class="field"><label for="dr-max">DR 至多</label><input id="dr-max" type="number" min="0" max="100"></div>
<div class="field"><label for="sort">排序</label><select id="sort"><option value="dr">DR 从高到低</option><option value="submit_count">提交产品数从高到低</option><option value="last_submitted_at">最近提交时间</option></select></div>
<div class="field"><label for="page-size">每页</label><select id="page-size"><option>20</option><option selected>50</option><option>100</option></select></div>
</section>
<p id="product-hint" class="muted">批量模式会自动提交；单页“打开并填写”不自动提交。验证码、登录、邮箱验证和付款转待人工。</p>
<div id="notice" class="banner err" role="alert" hidden></div><p id="action-status" role="status" aria-live="polite"></p>
<section id="editor" class="editor" hidden><h2 id="editor-heading">新增平台</h2><form id="record-form" class="stack"><fieldset id="record-fields" class="editor-grid"><legend class="sr-only">平台资料</legend>
<div class="field"><label for="record-domain">平台域名</label><input id="record-domain" required></div><div class="field"><label for="record-url">提交直达链接</label><input id="record-url" type="url" required></div><div class="field"><label for="record-scenario">外链类型</label><select id="record-scenario"></select></div><div class="field"><label for="record-fee">付费类型</label><select id="record-fee"></select></div><div class="field wide"><label for="record-note">备注</label><textarea id="record-note" rows="3" maxlength="10000"></textarea></div></fieldset><p id="form-status" role="status"></p><div class="actions"><button id="cancel-edit" type="button">收起</button><button id="save" type="submit" class="primary">保存平台</button></div></form></section>
<section id="importer" class="workflow" hidden><h2>导入 CSV / TXT</h2><p>CSV 列：url,type,fee,note；TXT 每行一个链接。按域名去重，只补空字段，其他链接追加为备用。</p><div class="actions"><button id="template">下载 CSV 模板</button><input id="import-file" type="file" accept=".csv,.txt" aria-label="选择外链文件"><button id="import-preview">预览</button><button id="import-confirm" class="primary" disabled>确认导入并补查 DR</button></div><pre id="import-status" role="status"></pre></section>
<section aria-label="平台清单"><div class="selection"><p id="summary" role="status">读取中…</p><button id="select-all" hidden>选择全部筛选结果</button><button id="clear-selection" hidden>清空选择</button></div><div id="results" aria-busy="true"></div><nav class="pager" aria-label="分页"><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></nav></section>
<section id="batch-panel" class="workflow" hidden><h2>批量任务</h2><div id="batch-progress" role="status"></div><div id="batch-list"></div></section>
<section id="manual-panel" class="workflow" hidden><h2>待人工集中处理</h2><p class="muted">已存档可重新打开并复原；未存档请保留原标签。结果未知禁止自动重试。</p><div id="manual-list"></div></section>
<div id="bulk-bar" class="batch-bar" hidden><b id="selected-count"></b><button id="batch-start" class="primary">批量发外链</button><select id="bulk-type" aria-label="修改外链类型"></select><button id="change-type">修改类型</button><select id="bulk-fee" aria-label="修改付费类型"></select><button id="change-fee">修改付费</button><button id="refresh-dr">刷新 DR</button><button id="mark">标记已提交</button><button id="unmark">撤销标记</button><button id="export-selected">导出所选</button><button id="delete-selected">删除</button></div>
</main>
<dialog id="delete-dialog"><h2>彻底删除平台</h2><p id="delete-message"></p><p>历史 ledger 保留，重新导入仍会识别已提交产品。</p><div class="actions"><button id="delete-cancel">取消</button><button id="delete-confirm">继续确认</button></div></dialog>
<dialog id="batch-dialog"><h2>批量发外链</h2><div class="stack"><label for="batch-site">产品（需要已有资料包）</label><select id="batch-site"></select><label for="batch-size">每批标签数量（5–20）</label><input id="batch-size" type="number" min="5" max="20" value="10"><button id="batch-preview">检查资格</button><pre id="batch-preview-status" role="status"></pre><div class="actions"><button id="batch-cancel">取消</button><button id="batch-confirm" class="primary" disabled>开始自动提交</button></div></div></dialog>
<script src="ui/icons.js"></script><script src="library.js"></script></body></html>
