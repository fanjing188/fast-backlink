<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast-Backlink 日志</title>
<link rel="stylesheet" href="vendor/fbl/brand.css">
<link rel="stylesheet" href="ui/app.css">
<style>
  .appbar .mark {width: 28px; height: 28px}
  html, body {height: 100%; overflow: hidden}
  body {display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr); height: 100vh}
  .filters {display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 16px; background: var(--paper);
    border-bottom: 1px solid var(--line-2)}
  .filters select {width: auto; min-height: var(--control); font-size: var(--fs-2)}
  .filters .search {max-width: 260px}
  .filters .search input {min-height: var(--control)}
  main {padding: 0 0 40px; overflow-y: auto; min-height: 0}
  .tablewrap {background: var(--paper); border-top: 0}
  table.data thead th {top: 0}
  table.data td {font-size: var(--fs-2)}
  .rowmain {cursor: pointer}
  .rowmain:hover td:first-child {color: var(--brand)}
  .hash {font-family: var(--mono); font-size: 10px; color: var(--ink-3)}
  .statline {border-bottom: 1px solid var(--line-2)}
  #summary {margin: 12px 16px 0}
  #summary .grid2 {margin-top: 8px}
  .reporttable td, .reporttable th {font-size: 12px}
  .bar-row {display: flex; align-items: center; gap: 8px}
  .bar-row .bar {flex: 1; height: 5px}
  .bar-row .bar i {background: var(--ok)}
  .bar-row .bar.warn i {background: var(--warn)}
  .empty-cell {padding: 0}
  .empty-cell .empty {padding: 48px 16px}
  .toasts {bottom: 20px}
  @media (max-width: 720px) {.filters {top: 0; position: static} table.data thead th {top: 0}}
  @media (max-width: 360px) {.appbar > button .ico {display: none}}
  @media (max-width: 480px) {
    .appbar {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px}
    .appbar > .mark {display: none}
    .appbar > .grow {grid-column: 1 / -1}
    .appbar > button {justify-content: center; min-width: 0; padding-inline: 4px}
    .filters {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px}
    .filters select {width: 100%; min-width: 0; padding-inline-start: 6px}
    .filters .search {grid-column: 1 / 3; max-width: none; min-width: 0}
    .filters > button {justify-self: end}
    table.data {min-width: 640px}
    .tablewrap {overflow-x: auto}
  }
</style>
</head>
<body class="app">
<header class="appbar">
  <img class="mark" src="icons/icon-48.png" alt="">
  <div class="grow" style="min-width:0">
    <div class="row" style="gap:8px"><b style="font-size:15px">Fast-Backlink 日志</b>
      <span class="pill line" id="range-pill">最近 7 天</span></div>
    <div class="muted" id="status" data-role="status" aria-live="polite">读取中…</div>
  </div>
  <button id="report"><span data-icon="trend"></span>生成周报</button>
  <button id="bundle"><span data-icon="copy"></span>诊断包</button>
  <button id="export"><span data-icon="download"></span>导出 JSONL</button>
</header>
<nav class="workspace-nav" aria-label="工作区">
  <a id="open-library" class="btn" href="library.html" target="_blank" rel="noopener"><span data-icon="list"></span>外链库</a>
  <a class="btn" href="options.html" target="_blank" rel="noopener"><span data-icon="image"></span>产品资料</a>
</nav>

<div class="filters">
  <select id="days" aria-label="时间范围"><option value="1">最近 1 天</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option></select>
  <select id="level" aria-label="级别"><option value="">全部级别</option><option>debug</option><option>info</option><option>warn</option><option>error</option></select>
  <select id="cat" aria-label="类别"><option value="">全部类别</option></select>
  <div class="search grow"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索标签、消息、字段…"></div>
  <button id="reload" class="icon ghost" title="刷新" aria-label="刷新"><span data-icon="refresh"></span></button>
</div>

<div class="statline" aria-hidden="true">
  <div class="stat idle"><span class="k">日志条数</span><span class="v" data-stat="entries">0</span></div>
  <div class="stat idle"><span class="k">可见</span><span class="v" data-stat="shown">0</span></div>
  <div class="stat warn"><span class="k">警告</span><span class="v" data-stat="warn">0</span></div>
  <div class="stat special"><span class="k">错误</span><span class="v" data-stat="error">0</span></div>
</div>

<main>
  <div id="summary" class="card" hidden>
    <div class="head"><span data-icon="trend"></span><h3>周报</h3><span class="muted" id="summary-line"></span></div>
    <div class="pad stack" id="summary-body"></div>
  </div>
  <div class="tablewrap">
    <table class="data">
      <thead><tr><th style="width:88px">时间</th><th style="width:84px">级别</th><th style="width:74px">类别</th><th>站点 / 来源</th><th>内容</th><th style="width:34px"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="ui/icons.js"></script>
<script src="logs.js"></script>
</body>
</html>
