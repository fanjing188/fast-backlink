<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast-Backlink 素材库</title>
<link rel="stylesheet" href="vendor/fbl/brand.css">
<link rel="stylesheet" href="ui/app.css">
<style>
  html, body {height: 100%; overflow: hidden}
  body {display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh}
  .shell {min-height: 0}
  .side, .main {overflow-y: auto; min-height: 0}
  .appbar .mark {width: 30px; height: 30px}
  .side summary {cursor: pointer; font-weight: 600; min-height: var(--control); display: list-item; align-content: center}
  .side details[open] summary {margin-bottom: 12px}
  .side details:not([open]) > :not(summary) {display: none}
  .side .panel {display: flex; flex-direction: column; gap: 6px}
  .side input[type=url] {font-size: var(--fs-1)}
  .side .actions {display: flex; gap: 6px; flex-wrap: wrap}
  .side .actions button {flex: 1; justify-content: center}
  .main {max-width: 1080px}
  .sitecard {display: flex; align-items: center; gap: 12px; padding: 14px 16px}
  .sitecard .glyph {width: 40px; height: 40px; border-radius: 11px; background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center; flex: none}
  .sitecard .glyph .ico {width: 20px; height: 20px}
  .sitecard h2 {font-size: 17px}
  .sitecard .meta {display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px}
  .groupnav {display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 2px}
  .groupnav a {font-size: 11px; color: var(--ink-2); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper)}
  .groupnav a:hover {border-color: var(--brand); color: var(--brand); text-decoration: none}
  .fieldrow {display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2)}
  .fieldrow:last-child {border-bottom: 0}
  .fieldrow .about {display: flex; flex-direction: column; gap: 2px}
  .fieldrow .about b {font-family: var(--mono); font-size: var(--fs-2); font-weight: 600}
  .fieldrow .about .note {font-size: var(--fs-2); color: var(--ink-3)}
  .fieldrow .edit {display: flex; flex-direction: column; gap: 6px; min-width: 0}
  .fieldrow textarea {min-height: var(--control); font-size: var(--fs-3)}
  .fieldrow textarea.tall {min-height: 96px}
  .fieldrow .under {display: flex; align-items: center; gap: 8px; flex-wrap: wrap}
  .fieldrow .under .vchips {flex-basis: 100%}
  .vchips {display: flex; gap: 4px; flex-wrap: wrap}
  .vchip {font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2)}
  .vchip.on {border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); color: var(--ok); background: var(--ok-bg)}
  .vchip.off {color: var(--ink-3); border-style: dashed}
  .media-grid {grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))}
  .media .thumb {aspect-ratio: 16 / 10}
  .media video {width: 100%; height: 100%; object-fit: contain; background: #000}
  .media .alt {padding: 0 8px 8px}
  .media .alt input {font-size: var(--fs-2)}
  .media .bar {padding-bottom: 8px}
  .media.missing {border-style: dashed; background: var(--bg)}
  .media.missing .thumb {background: transparent; color: var(--ink-3); flex-direction: column; gap: 4px; font-size: 11px}
  .checkreport {display: flex; flex-direction: column; gap: 8px}
  .checkreport ul {margin: 4px 0 0; padding-inline-start: 18px; font-size: 12px}
  .checkreport li {margin: 2px 0}
  .checkreport .ok {color: var(--ok); font-weight: 600}
  .qa-row {display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2)}
  .qa-row:last-child {border-bottom: 0}
  .diff-legend {display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-3)}
  .toasts {bottom: 20px}
  @media (max-width: 860px) {.fieldrow {grid-template-columns: 1fr}}
  @media (max-width: 720px) {
    .shell {grid-template-rows: auto minmax(0, 1fr)}
    .side {gap: 12px; padding: 12px 16px; overflow-y: auto; max-height: 240px}
    .side .panel {min-width: 0}
    .side .navlist {display: flex; flex-direction: row; overflow-x: auto; gap: 4px}
    .side .navlist li {flex: none}
    .side .navlist button {white-space: nowrap}
    .side .shared-actions {display: flex; flex-direction: row; align-items: center; gap: 8px}
    .shared-actions h3 {margin: 0}
    .shared-actions .actions {flex: 1}
    .appbar {display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px}
    .appbar > .mark {display: none}
    .appbar > .grow {grid-column: 1 / -1}
    .appbar > button {justify-content: center; min-width: 0; padding-inline: 6px}
    .sitecard {flex-wrap: wrap}
    .sitecard > .grow {flex-basis: calc(100% - 56px)}
    .sitecard > button {flex: 1; justify-content: center}
    .qa-row {grid-template-columns: minmax(0, 1fr) auto}
    .qa-row textarea {grid-column: 1 / -1}
  }
</style>
</head>
<body class="app">
<header class="appbar">
  <img class="mark" src="icons/icon-48.png" alt="">
  <div class="grow" style="min-width:0">
    <div class="row" style="gap:8px"><b style="font-size:15px">Fast-Backlink 素材库</b>
      <span class="pill brand">v2 资料包</span>
      <span class="conn" id="conn" title="本机服务"><i></i><span>本机</span></span></div>
    <div class="muted" id="status" data-role="status" aria-live="polite">读取中…</div>
  </div>
  <button id="check"><span data-icon="check"></span>检查完整度</button>
  <button id="export"><span data-icon="download"></span>导出</button>
  <button id="import"><span data-icon="upload"></span>导入</button>
</header>

<div class="shell">
  <aside class="side">
    <nav class="workspace-nav" aria-label="工作区">
      <a id="open-library" class="btn" href="library.html" target="_blank" rel="noopener"><span data-icon="list"></span>外链库</a>
    </nav>
    <details class="panel service-panel">
      <summary>本机连接与设置</summary>
      <label class="field"><span>续填列表完整地址</span>
        <input id="address" type="url" placeholder="http://127.0.0.1:18780/令牌/" autocomplete="off" spellcheck="false"></label>
      <div class="actions"><button id="save-base" class="primary">保存连接</button><button id="health">检查</button></div>
    </details>

    <section class="panel">
      <h3>项目</h3>
      <ul class="navlist" id="sites"></ul>
    </section>

    <section class="panel shared-actions">
      <h3>共享素材</h3>
      <div class="actions"><button id="edit-profile"><span data-icon="globe"></span>身份档案</button></div>
      <div class="actions"><button id="edit-qa"><span data-icon="info"></span>问答库</button></div>
    </section>

    <details class="panel">
      <summary>使用说明</summary>
      <p class="muted">资料包是唯一数据源，写入 <code>reports/backlinks/kits/&lt;site&gt;/</code>。字段改动即时保存；素材上传会校验尺寸与格式。</p>
    </details>
  </aside>
  <main class="main" id="editor" aria-live="polite"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="logic.js"></script>
<script src="lib/text.js"></script>
<script src="ui/icons.js"></script>
<script src="options.js"></script>
</body>
</html>
