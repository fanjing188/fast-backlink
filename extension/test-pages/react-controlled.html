<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>React controlled form</title>
<style>body{font:15px system-ui;margin:24px;max-width:720px}label{display:block;margin:10px 0 2px}
input,textarea,select{font:inherit;padding:5px;width:100%;max-width:520px}
.row{display:flex;gap:8px} .hint{color:#6b7280;font-size:12px}
.hp{position:absolute;left:-9999px} .chips .token{display:inline-block;background:#eef;border-radius:999px;padding:1px 8px;margin:2px}
[role=listbox]{border:1px solid #ccc;max-height:160px;overflow:auto;background:#fff;position:relative;z-index:5}
[role=option]{padding:4px 8px;cursor:pointer} [role=option]:hover{background:#eef}
.ql-editor,.ProseMirror,.ck-editor__editable{border:1px solid #ccc;min-height:70px;padding:6px;background:#fff}
.choices__list--dropdown{border:1px solid #ccc;background:#fff} .choices__item--choice{padding:4px 8px;cursor:pointer}
.select2-container{display:inline-block} .select2-selection{border:1px solid #ccc;padding:4px 8px;cursor:pointer}
.select2-results__option{padding:4px 8px;cursor:pointer}</style>
</head><body>
<h1>React controlled form</h1>
<p class="hint">受控组件：不派发 input 事件的写法会被回滚。</p>

<div id="root"></div><script>
const state = {name: '', description: '', email: ''};
const root = document.getElementById('root');
function render() {
  root.innerHTML = `
    <label for="name">Product name</label><input id="name" value="${state.name.replace(/"/g,'&quot;')}">
    <label for="description">Short description (max 160 characters)</label><input id="description" maxlength="160" value="${state.description.replace(/"/g,'&quot;')}">
    <label for="email">Email</label><input id="email" type="email" value="${state.email.replace(/"/g,'&quot;')}">
    <div id="mirror">${state.name}|${state.description}|${state.email}</div>`;
  for (const [id, key] of [['name','name'],['description','description'],['email','email']]) {
    document.getElementById(id).addEventListener('input', event => {state[key] = event.target.value; render(); event.stopPropagation();});
  }
}
render();
</script>
<script type="application/json" id="fixture-expect">{"fields":{"#name":"name","#description":"description","#email":"email"},"controlled":true}</script>
</body></html>
